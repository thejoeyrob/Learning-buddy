<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#1f6fff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Learning Buddy" />
  <meta name="description" content="Learning Buddy: visual Grade 5 home learning with young learning-buddy avatars, guided lessons, knowledge checks, quizzes and parent progress." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Learning Buddy — Grade 5</title>
</head>
<body>
  <div id="authScreen" class="auth-screen"></div>

  <div id="appShell" class="app-shell hidden">
    <header class="topbar">
      <button id="homeBtn" class="brand" aria-label="Home">
        <span class="brand-orbit"><img src="icon-192.png" alt=""></span>
        <span class="brand-copy"><strong>Learning Buddy</strong><small>Grade 5 home learning</small></span>
      </button>
      <div class="top-actions">
        <button id="installBtn" class="mini-button hidden" type="button">Install</button>
        <button id="parentBtn" class="round-button" type="button" aria-label="Parent dashboard" title="Parent dashboard">🔒</button>
      </div>
    </header>

    <main id="mainContent" class="main-content">
      <section id="homeView" class="view"></section>
      <section id="subjectView" class="view hidden"></section>
      <section id="progressView" class="view hidden"></section>
    </main>

    <nav class="child-nav" aria-label="Learner navigation">
      <button id="navHome" class="nav-button active"><span>⌂</span><b>Home</b></button>
      <button id="navProgress" class="nav-button"><span>★</span><b>My progress</b></button>
      <button id="navLogout" class="nav-button"><span>↪</span><b>Sign out</b></button>
    </nav>
  </div>

  <section id="sessionOverlay" class="session-overlay hidden" aria-live="polite">
    <header class="session-topbar">
      <button id="sessionClose" class="round-button light" aria-label="Exit session">✕</button>
      <div class="session-progress"><i id="sessionProgressFill"></i></div>
      <span id="sessionStepCount">1 / 6</span>
    </header>
    <main id="sessionStage" class="session-stage"></main>
  </section>

  <section id="parentOverlay" class="parent-overlay hidden" aria-modal="true" role="dialog">
    <div id="parentGate" class="parent-gate"></div>
    <div id="parentDashboard" class="parent-dashboard hidden"></div>
  </section>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="question-bank.js"></script>
  <script src="extras.js"></script>
  <script src="math-extras.js"></script>
  <script src="curriculum.js"></script>
  <script src="app.js"></script>
</body>
</html>
